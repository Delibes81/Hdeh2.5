[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Tell Netlify to ignore Supabase keys in the build output (they are public by design)
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
